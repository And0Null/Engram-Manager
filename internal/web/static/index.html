<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engram Manager</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="layout">
    <aside id="sidebar">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark">◈</span>
          <span class="brand-name">Engram Manager</span>
        </div>
      </div>

      <nav id="nav">
        <button class="nav-item" data-view="overview" aria-current="page">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.5"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" data-view="radar">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>
          <span>Action Radar</span>
          <span class="nav-count" data-count="radar">—</span>
        </button>
        <button class="nav-item" data-view="memories">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>Memories</span>
          <span class="nav-count" data-count="memories">—</span>
        </button>
        <button class="nav-item" data-view="relations">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6h7M8.5 18h7M6 8.5v7M18 8.5v7"/></svg>
          <span>Relations</span>
          <span class="nav-count" data-count="relations">—</span>
        </button>
        <button class="nav-item" data-view="sessions">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3.5 2"/></svg>
          <span>Sessions</span>
          <span class="nav-count" data-count="sessions">—</span>
        </button>
        <button class="nav-item" data-view="review">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 13l5 5L20 7"/></svg>
          <span>Review</span>
          <span class="nav-count" data-count="review">—</span>
        </button>
        <button class="nav-item" data-view="system">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
          <span>System &amp; Health</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="engine-row">
          <div class="engine-status">
            <span class="dot dot-wait" data-engine-dot></span>
            <span class="engine-text" data-engine-label>connecting…</span>
          </div>
          <span class="live-badge" data-live-status title="Real-time SSE active">
            <span class="live-dot"></span>LIVE
          </span>
        </div>
        <div class="foot-metrics">
          <div class="foot-metric">
            <span class="metric-tag">DB</span>
            <span class="metric-val mono" data-db-size>—</span>
          </div>
          <div class="foot-metric" data-wal-metric>
            <span class="metric-tag">WAL</span>
            <span class="metric-val mono" data-wal-size>—</span>
          </div>
        </div>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <div>
          <h1 class="page-title" data-page-title>Overview</h1>
          <p class="page-sub" data-page-sub>Loading store…</p>
        </div>
        <div class="topbar-tools">
          <div class="field">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M20.5 20.5L16 16"/></svg>
            <input type="search" data-search placeholder="Search memories…  /" aria-label="Search memories">
          </div>
          <button class="btn" data-refresh>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.5 12a8.5 8.5 0 1 1-2.6-6.1"/><path d="M20.5 4.5V10H15"/></svg>
            Refresh
          </button>
        </div>
      </header>

      <div id="content"></div>
    </main>
  </div>

  <div class="backdrop" data-drawer-backdrop hidden></div>
  <aside class="drawer" data-drawer hidden aria-label="Memory detail">
    <div class="drawer-head">
      <div>
        <div class="drawer-ref" data-drawer-ref>—</div>
        <h2 data-drawer-title>Detail</h2>
      </div>
      <button class="icon-btn" data-drawer-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" data-drawer-body></div>
    <div class="drawer-foot" data-drawer-foot></div>
  </aside>

  <div id="toasts" aria-live="polite"></div>

  <script src="/app.js"></script>
</body>
</html>
