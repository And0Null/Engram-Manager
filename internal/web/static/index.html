<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Engram Manager</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="layout">
    <!-- Sidebar Navigation -->
    <aside id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="var(--cyan)"/>
            <path d="M2 17l10 5 10-5" stroke="var(--magenta)"/>
            <path d="M2 12l10 5 10-5" stroke="var(--teal)"/>
          </svg>
          <div class="brand-info">
            <span class="brand-name">Engram</span>
            <span class="brand-sub">Manager</span>
          </div>
        </div>
        <span class="badge badge-codec">Pi Codec</span>
      </div>

      <nav id="nav">
        <button class="nav-item active" data-view="overview">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav-item" data-view="memories">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h12"/></svg>
          <span>Memories</span>
          <span class="nav-count" id="nav-count-memories">—</span>
        </button>
        <button class="nav-item" data-view="relations">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M8.5 8.5l7 7"/><circle cx="18" cy="6" r="3"/><path d="M8.5 15.5l7-7"/></svg>
          <span>Relaciones</span>
          <span class="nav-count" id="nav-count-relations">—</span>
        </button>
        <button class="nav-item" data-view="sessions">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><polyline points="12 6 12 12 16 14"/></svg>
          <span>Sesiones</span>
          <span class="nav-count" id="nav-count-sessions">—</span>
        </button>
        <button class="nav-item" data-view="review">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span>Revisión</span>
          <span class="nav-count" id="nav-count-review">—</span>
        </button>
        <button class="nav-item" data-view="system">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg>
          <span>Sistema & Salud</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="connection-status" id="engine-status">
          <span class="status-dot dot-connecting" id="engine-dot"></span>
          <span class="status-label" id="engine-label">Conectando...</span>
        </div>
        <div class="db-stats" id="db-stats-meta">
          <span id="db-size-label">DB: —</span>
          <span id="wal-size-label">WAL: —</span>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main id="main">
      <header id="topbar">
        <div class="topbar-title">
          <h1 id="page-title">Overview</h1>
          <span class="topbar-desc" id="page-subtitle">Panel general de memoria y métricas operativas</span>
        </div>
        <div class="topbar-actions">
          <div class="search-box" id="global-search-box">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="global-search-input" placeholder="Buscar trigrama en memorias... (/)" />
          </div>
          <button class="btn btn-secondary" id="btn-refresh" title="Recargar datos">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            <span>Recargar</span>
          </button>
        </div>
      </header>

      <div id="content">
        <!-- Rendered dynamically by app.js -->
        <div class="loading-state">
          <div class="spinner"></div>
          <span>Cargando datos de Engram...</span>
        </div>
      </div>
    </main>
  </div>

  <!-- Detail Drawer for Memory inspection & editing -->
  <div id="drawer-backdrop" class="backdrop hidden"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-header">
      <div class="drawer-title-group">
        <span class="drawer-eyebrow" id="drawer-eyebrow">MEMORIA</span>
        <h2 id="drawer-title">Detalle</h2>
      </div>
      <button class="btn-close" id="drawer-close" title="Cerrar (Esc)">&times;</button>
    </div>
    <div class="drawer-body" id="drawer-body">
      <!-- Content populated by app.js -->
    </div>
    <div class="drawer-footer" id="drawer-footer">
      <!-- Action buttons -->
    </div>
  </aside>

  <!-- Notification Toast Container -->
  <div id="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
